# NEEDS NATIVE REVIEW
# Language: Telugu (te-IN)
lang_code: "te-IN"
lang_name: "తెలుగు (Telugu)"

spoken:
  ai_disclosure: "నమస్కారం అక్కా, నేను ఏఐ సహాయకుడిని. దయచేసి మీ సందర్శన వివరాలను చెప్పండి."
  prompt_listen: "చెప్పండి అక్కా, నేను వింటున్నాను."
  referral_line: "దయచేసి వెంటనే ప్రాథమిక ఆరోగ్య కేంద్రానికి (PHC) రెఫర్ చేయండి."
  save_confirm: "మిగిలినవన్నీ సరిగ్గా ఉన్నాయి, సేవ్ చేయమంటారా?"
  ask_weight: "దయచేసి బరువు చెప్పండి."
  ask_bp: "దయచేసి రక్తపోటు (BP) చెప్పండి."
  ask_last_anc: "చివరి ఏఎన్సీ పరీక్ష ఎప్పుడు జరిగింది?"
  ask_ifa: "ఐరన్ మాత్రలు తీసుకున్నారా?"
  ask_beneficiary_id: "దయచేసి లబ్ధిదారుని పేరు లేదా ఐడీ చెప్పండి."
  disambiguate_name: "ఈ పేరుతో ఇద్దరు లబ్ధిదారులు ఉన్నారు - {name}, ఇంటి నంబర్ {h1} లేదా {h2}?"
  confusable_confirm: "మీరు {word} అన్నారా? దయచేసి ధృవీకరించండి."
  record_saved: "వివరాలు భద్రంగా నమోదయ్యాయి. తదుపరి ఫాలో-అప్ జాబితా ఇదిగో."

