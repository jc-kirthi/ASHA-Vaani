# Deterministic Follow-up Schedules for ASHA Vaani
# Sourced strictly from MoHFW Guidelines (National Immunization Schedule, ANC Schedule, HBNC Protocol)
# No LLM hallucinations: all dates and due items are calculated via deterministic date arithmetic.

anc_schedule:
  description: "Pradhan Mantri Surakshit Matritva Abhiyan (PMSMA) & NHM ANC Schedule"
  visits:
    - visit: 1
      window_weeks: "Up to 12 weeks"
      days_from_lmp: 84
      focus: "Registration, baseline tests, IFA tablets, TT1 / Td1"
    - visit: 2
      window_weeks: "14 to 26 weeks"
      days_from_lmp: 182
      focus: "BP, weight, abdominal exam, TT2 / Td2, USG scan"
    - visit: 3
      window_weeks: "28 to 34 weeks"
      days_from_lmp: 238
      focus: "Growth monitoring, anemia check, fetal movement, BP"
    - visit: 4
      window_weeks: "36 weeks to term"
      days_from_lmp: 266
      focus: "Birth preparedness, institutional delivery plan, danger signs review"

hbnc_schedule:
  description: "MoHFW Home Based New Born Care (HBNC) home visit schedule"
  institutional_delivery_days: [3, 7, 14, 21, 28, 42]
  home_delivery_days: [1, 3, 7, 14, 21, 28, 42]
  vital_checks:
    - "Cord care (dry, clean, no redness/discharge)"
    - "Exclusive breastfeeding & latch assessment"
    - "Body warmth & temperature check"
    - "Weight gain monitoring (digital scale)"
    - "Screening for danger signs (fever, hypothermia, chest indrawing, yellow soles)"

immunization_schedule:
  description: "National Immunization Schedule (Universal Immunization Programme - India)"
  milestones:
    - age_label: "At birth"
      days_from_birth: 0
      vaccines: ["BCG", "OPV-0", "Hepatitis B birth dose"]
    - age_label: "6 weeks"
      days_from_birth: 42
      vaccines: ["OPV-1", "Pentavalent-1", "Rotavirus-1", "fIPV-1", "PCV-1"]
    - age_label: "10 weeks"
      days_from_birth: 70
      vaccines: ["OPV-2", "Pentavalent-2", "Rotavirus-2"]
    - age_label: "14 weeks"
      days_from_birth: 98
      vaccines: ["OPV-3", "Pentavalent-3", "Rotavirus-3", "fIPV-2", "PCV-2"]
    - age_label: "9 months"
      days_from_birth: 270
      vaccines: ["MR-1 (Measles-Rubella)", "JE-1", "PCV Booster", "Vitamin A 1st dose"]
    - age_label: "16-24 months"
      days_from_birth: 480
      vaccines: ["MR-2", "JE-2", "DPT Booster-1", "OPV Booster"]

ifa_protocol:
  pregnancy_tablets: 180
  lactation_tablets: 180
  check_message: "Ensure daily IFA intake after 1st trimester; report black stools as harmless."
